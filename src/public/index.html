<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flower Care - 花卉管理</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>Flower Care</h1>
      <p>家庭花卉管理助手</p>
    </div>
  </header>

  <!-- Admin gear button (fixed, bottom-right corner) -->
  <button class="admin-gear" id="btn-admin-toggle" title="管理员">⚙</button>
  <span class="admin-badge" id="admin-badge" style="display:none;">管理员模式</span>

  <main class="container">
    <!-- Flower section -->
    <section class="section">
      <div class="section-header">
        <h2>我的花卉</h2>
        <div class="section-header-actions">
          <button class="btn btn-outline" id="btn-view-all-logs">浇水历史</button>
          <button class="btn btn-primary admin-only" id="btn-add-flower" style="display:none;">+ 添加花卉</button>
        </div>
      </div>
      <div class="flower-grid" id="flower-grid">
        <!-- Cards rendered by JS -->
      </div>
      <p class="empty-hint" id="flower-empty">还没有添加花卉</p>
    </section>

    <!-- Comment section -->
    <section class="section">
      <div class="section-header">
        <h2>留言板</h2>
      </div>
      <form class="comment-form" id="comment-form">
        <input type="text" id="comment-nickname" placeholder="你的昵称" required maxlength="20" />
        <textarea id="comment-content" placeholder="写点什么..." required maxlength="500" rows="3"></textarea>
        <button type="submit" class="btn btn-primary">发表留言</button>
      </form>
      <div class="comment-list" id="comment-list">
        <!-- Comments rendered by JS -->
      </div>
      <p class="empty-hint" id="comment-empty">暂无留言</p>
    </section>
  </main>

  <footer class="footer">
    <p>Flower Care &nbsp;·&nbsp; 用心呵护每一株花</p>
  </footer>

  <!-- Admin login modal -->
  <div class="modal-overlay" id="admin-login-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>管理员登录</h3>
        <button class="modal-close" id="admin-login-close">&times;</button>
      </div>
      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-password">管理员密码</label>
          <input type="password" id="admin-password" required placeholder="请输入密码" />
        </div>
        <p class="admin-login-error" id="admin-login-error"></p>
        <button type="submit" class="btn btn-primary btn-block">确认登录</button>
      </form>
    </div>
  </div>

  <!-- Add flower modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="flower-modal-title">添加花卉</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="flower-form">
        <input type="hidden" id="flower-edit-id" value="" />
        <div class="form-group">
          <label for="flower-name">花卉名称 *</label>
          <input type="text" id="flower-name" required maxlength="50" placeholder="例如：绿萝" />
        </div>
        <div class="form-group">
          <label>照片</label>
          <div class="photo-mode-tabs">
            <button type="button" class="photo-tab active" id="tab-upload">本地上传</button>
            <button type="button" class="photo-tab" id="tab-url">网络链接</button>
          </div>
          <input type="file" id="flower-photo" accept="image/*" />
          <input type="url" id="flower-photo-url" placeholder="https://example.com/flower.jpg" style="display:none;" />
        </div>
        <div class="form-group">
          <label for="flower-interval">浇水频率（天）</label>
          <input type="number" id="flower-interval" min="1" max="90" value="3" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="flower-submit-btn">确认添加</button>
      </form>
    </div>
  </div>

  <!-- Water time modal -->
  <div class="modal-overlay" id="water-modal-overlay">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 id="water-modal-title">记录浇水</h3>
        <button class="modal-close" id="water-modal-close">&times;</button>
      </div>
      <form id="water-form">
        <div class="form-group">
          <label for="water-time">浇水时间</label>
          <input type="datetime-local" id="water-time" required />
        </div>
        <div class="form-group">
          <label for="water-mood">浇水心情</label>
          <div class="mood-input-wrap">
            <input type="text" id="water-mood" maxlength="100" placeholder="加载诗词中…" />
            <button type="button" class="btn-mood-refresh" id="btn-mood-refresh" title="换一句">↻</button>
          </div>
        </div>
        <button type="submit" class="btn btn-water btn-block">确认浇水</button>
      </form>
    </div>
  </div>

  <!-- Watering history modal -->
  <div class="modal-overlay" id="log-modal-overlay">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="log-modal-title">浇水历史</h3>
        <button class="modal-close" id="log-modal-close">&times;</button>
      </div>
      <div id="log-list" class="log-list"></div>
      <p class="empty-hint" id="log-empty" style="display:none;">暂无浇水记录</p>
    </div>
  </div>

  <!-- Edit watering log modal -->
  <div class="modal-overlay" id="log-edit-overlay">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>编辑浇水记录</h3>
        <button class="modal-close" id="log-edit-close">&times;</button>
      </div>
      <form id="log-edit-form">
        <input type="hidden" id="log-edit-id" />
        <div class="form-group">
          <label for="log-edit-time">浇水时间</label>
          <input type="datetime-local" id="log-edit-time" required />
        </div>
        <div class="form-group">
          <label for="log-edit-mood">浇水心情</label>
          <input type="text" id="log-edit-mood" maxlength="100" placeholder="可选" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">保存修改</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
