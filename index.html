<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flower Care - 花卉管理</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>Flower Care</h1>
      <p>家庭花卉管理助手</p>
    </div>
  </header>

  <main class="container">
    <!-- Flower section -->
    <section class="section">
      <div class="section-header">
        <h2>我的花卉</h2>
        <button class="btn btn-primary" id="btn-add-flower">+ 添加花卉</button>
      </div>
      <div class="flower-grid" id="flower-grid">
        <!-- Cards rendered by JS -->
      </div>
      <p class="empty-hint" id="flower-empty">还没有添加花卉，点击上方按钮开始吧</p>
    </section>

    <!-- Comment section -->
    <section class="section">
      <h2>留言板</h2>
      <form class="comment-form" id="comment-form">
        <input type="text" id="comment-nickname" placeholder="你的昵称" required maxlength="20" />
        <textarea id="comment-content" placeholder="写点什么..." required maxlength="500" rows="3"></textarea>
        <button type="submit" class="btn btn-primary">发表留言</button>
      </form>
      <div class="comment-list" id="comment-list">
        <!-- Comments rendered by JS -->
      </div>
      <p class="empty-hint" id="comment-empty">暂无留言</p>
    </section>
  </main>

  <!-- Add flower modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>添加花卉</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="flower-form">
        <div class="form-group">
          <label for="flower-name">花卉名称 *</label>
          <input type="text" id="flower-name" required maxlength="50" placeholder="例如：绿萝" />
        </div>
        <div class="form-group">
          <label for="flower-photo">照片</label>
          <input type="file" id="flower-photo" accept="image/*" />
        </div>
        <div class="form-group">
          <label for="flower-interval">浇水频率（天）</label>
          <input type="number" id="flower-interval" min="1" max="90" value="3" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">确认添加</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
